name: ARCHE Coverage Watchdog

# 글을 만들지 않는다. 발행(매일 07:30 KST, Aside 루틴)이 실제로 되었는지 검사만 한다.
# 실패하면 GitHub 이 저장소 소유자에게 메일로 알린다.

on:
  schedule:
    # 10:00 KST - 아침 발행 확인
    - cron: '0 1 * * *'
    # 21:00 KST - 저녁 재확인
    - cron: '0 12 * * *'
  push:
    paths:
      - 'data/columns_db.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Check daily coverage (9 categories x every date)
        run: python scripts/check_coverage.py
