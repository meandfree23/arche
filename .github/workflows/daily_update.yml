name: ARCHE Coverage Watchdog

# 글을 만들지 않는다. 발행이 실제로 되었는지 검사만 한다.
# 발행: 클라우드 예약 작업 06:33 KST (본 실행) + 12:33 KST (재시도, 이미 발행됐으면 아무것도 안 함)
# 실패하면 GitHub 이 저장소 소유자에게 메일로 알린다.

on:
  schedule:
    # 13:20 KST - 본 실행과 재시도가 모두 끝난 뒤 확인
    - cron: '20 4 * * *'
    # 21:00 KST - 저녁 재확인
    - cron: '0 12 * * *'
  push:
    paths:
      - 'data/columns_db.json'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Archive structure (JSON, id 번호, 표기, 하루 1편)
        run: python scripts/publish_guard.py audit

      - name: Daily coverage (9 categories x every date)
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # 백필 push 가 오늘 발행 전에 올 수 있으므로 push 때는 오늘 누락을 경고로만
            python scripts/check_coverage.py --allow-today-missing
          else
            python scripts/check_coverage.py
          fi
