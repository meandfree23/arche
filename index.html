<!DOCTYPE html>
<html lang="ko" class="theme-paper">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARCHE | 문학의 정원</title>
  <meta name="description" content="프란츠 카프카부터 봉준호, 니체, 롤랑 바르트, 그리스 신화까지 — 문학·영화·철학·비평·신화를 가로지르는 매일의 에디토리얼 칼럼과 사색의 공간, ARCHE 문학의 정원.">
  
  <!-- Inline SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238E4B23' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z'/><path d='M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z'/></svg>">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+KR:wght@300;400;500;600;700;900&family=Pretendard:wght@300;400;500&display=swap" rel="stylesheet">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif KR"', '"Cormorant Garamond"', 'serif'],
            latin: ['"Cormorant Garamond"', 'serif'],
            title: ['"Cinzel"', '"Noto Serif KR"', 'serif'],
            sans: ['Pretendard', '-apple-system', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    :root.theme-paper {
      --bg-main: #F7F5F0;
      --bg-surface: #FCFAF6;
      --bg-card: #FFFFFF;
      --border-subtle: #E8E3DA;
      --text-primary: #18191B;
      --text-secondary: #52555C;
      --text-muted: #8E9199;
      --accent: #8E4B23;
      --accent-soft: rgba(142, 75, 35, 0.06);
    }

    :root.theme-dark {
      --bg-main: #131416;
      --bg-surface: #191B1F;
      --bg-card: #21242A;
      --border-subtle: #262B33;
      --text-primary: #EEF0F2;
      --text-secondary: #A2A7B0;
      --text-muted: #626772;
      --accent: #DEAB75;
      --accent-soft: rgba(222, 171, 117, 0.1);
    }

    :root.theme-light {
      --bg-main: #FFFFFF;
      --bg-surface: #FAFAFA;
      --bg-card: #FFFFFF;
      --border-subtle: #F0F0F0;
      --text-primary: #111827;
      --text-secondary: #4B5563;
      --text-muted: #9CA3AF;
      --accent: #2B3441;
      --accent-soft: rgba(43, 52, 65, 0.06);
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      transition: background-color 0.4s ease, color 0.4s ease;
      font-family: "Noto Serif KR", serif;
      word-break: keep-all;
    }

    /* Editorial Headline Emphasis */
    .article-headline {
      font-family: "Noto Serif KR", serif;
      font-weight: 700;
      line-height: 1.48;
      letter-spacing: -0.025em;
    }

    /* Long-form reading typography */
    .article-body p {
      margin-bottom: 2.2rem;
      line-height: 2.15;
      font-size: var(--article-font-size, 1.125rem);
      color: var(--text-primary);
      text-align: justify;
      letter-spacing: -0.015em;
    }

    .article-lead {
      font-size: 1.28rem;
      line-height: 2.15;
      color: var(--text-secondary);
      font-weight: 400;
      padding-bottom: 2rem;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border-subtle);
    }

    .article-dropcap::first-letter {
      font-size: 3.8rem;
      float: left;
      line-height: 0.8;
      padding-right: 0.8rem;
      padding-top: 0.2rem;
      font-family: "Cormorant Garamond", serif;
      font-weight: 700;
      color: var(--accent);
    }

    /* Minimal Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 2px;
    }

    .reading-progress-track {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 2px;
      background: transparent;
      overflow: hidden;
    }
    .reading-progress-bar {
      width: 0%;
      height: 100%;
      background: var(--accent);
      transition: width 0.12s linear;
    }
    .category-nav-button {
      position: relative;
      border-radius: 999px;
      padding: 0.42rem 0.65rem;
      white-space: nowrap;
    }
    .category-nav-button.is-active {
      background: var(--accent-soft);
      box-shadow: inset 0 0 0 1px var(--border-subtle);
    }
    .category-nav-button .new-dot {
      display: inline-block;
      width: 4px;
      height: 4px;
      margin-left: 5px;
      border-radius: 999px;
      background: var(--accent);
      vertical-align: middle;
    }
    #mobileCategoryNav {
      scroll-snap-type: x proximity;
      -webkit-mask-image: linear-gradient(to right, #000 0%, #000 88%, transparent 100%);
      mask-image: linear-gradient(to right, #000 0%, #000 88%, transparent 100%);
    }
    #mobileCategoryNav .category-nav-button {
      min-height: 40px;
      scroll-snap-align: center;
      display: inline-flex;
      align-items: center;
    }
    .today-card {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      border-bottom: 1px solid var(--border-subtle);
      background: transparent;
      border-radius: 0;
      padding: 1rem 0;
      transition: opacity 0.2s ease;
    }
    .today-card:hover { opacity: 0.68; }
    .today-card.is-read { opacity: 0.45; }
    .today-signal {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .today-link-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 1rem;
      width: 100%;
      padding: 0.9rem 0;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
      transition: opacity 0.2s ease;
    }
    .today-link-row:hover { opacity: 0.62; }
    body.modal-open { overflow: hidden; }
    @media (max-width: 640px) {
      .article-body p {
        text-align: left;
        line-height: 2.05;
        font-size: var(--article-font-size, 1.06rem);
      }
      .article-lead { font-size: 1.12rem; line-height: 1.95; }
      .article-dropcap::first-letter { font-size: 3.1rem; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- ULTRA-MINIMAL SINGLE HEADER -->
  <header class="sticky top-0 z-40 backdrop-blur-md transition-colors duration-300" style="background-color: rgba(var(--bg-main), 0.92); border-bottom: 1px solid var(--border-subtle);">
    <div class="max-w-3xl mx-auto px-6 h-14 flex items-center justify-between">
      
      <!-- Brand Logo -->
      <a href="javascript:void(0)" onclick="goToLatestArticle()" class="group flex items-baseline gap-2">
        <span class="font-title text-lg tracking-[0.25em] font-semibold" style="color: var(--text-primary);">ARCHE</span>
      </a>

      <!-- Category navigation stays available through Today and Library -->
      <nav class="hidden" id="minimalCategoryNav"></nav>

      <div class="flex items-center gap-4 text-xs font-sans">
        <button onclick="openToday()" class="hover:opacity-55 transition" style="color: var(--accent);" title="오늘의 글 보기">
          오늘 <span id="headerTodayCount"></span>
        </button>
        <button onclick="openSearch()" class="hover:opacity-55 transition" style="color: var(--text-secondary);" title="검색" aria-label="검색 열기">
          <i data-lucide="search" class="w-3.5 h-3.5"></i>
        </button>
        <button onclick="openMenu()" class="hover:opacity-55 transition" style="color: var(--text-secondary);">서재</button>
      </div>

    </div>

    <nav class="hidden" id="mobileCategoryNav"></nav>
    <div class="reading-progress-track" aria-hidden="true"><div id="readingProgressBar" class="reading-progress-bar"></div></div>
  </header>


  <!-- MAIN ARTICLE CONTAINER -->
  <main class="flex-1 max-w-2xl w-full mx-auto px-6 py-12 sm:py-20">
    
    <article id="articleContentWrapper" class="animate-fadeIn flex flex-col gap-10">
      
      <!-- Quiet daily context -->
      <div id="todayContextBar" class="flex items-center justify-between gap-4 text-[11px] font-sans" style="color: var(--text-muted);">
        <button onclick="openToday()" class="hover:opacity-55 transition text-left">
          <span id="todayContextLabel" style="color: var(--accent);">오늘의 ARCHE</span>
          <span class="mx-1 opacity-40">·</span>
          <span id="todayContextCount"></span>
        </button>
        <span id="todayReadProgress"></span>
      </div>

      <!-- ARTICLE HERO: PURE HEADLINE EMPHASIS -->
      <header class="space-y-6">
        
        <!-- Category & Order Breadcrumb + Share -->
        <div class="flex items-center justify-between gap-4">
          <div class="text-[11px] font-sans tracking-widest uppercase flex items-center gap-2 flex-wrap" style="color: var(--text-muted);" id="articleCategoryBreadcrumb">
            문학의 심연 — 제 1편
            <span id="articleDateBadge" class="px-1.5 py-0.5 rounded-full text-[10px] normal-case tracking-normal" style="background-color: var(--accent-soft); color: var(--accent);"></span>
            <span id="articleReadTime" class="text-[10px] normal-case tracking-normal"></span>
          </div>
          <button onclick="copyArticleLink()" class="flex items-center gap-1 text-[11px] font-sans hover:opacity-60 transition shrink-0" style="color: var(--text-muted);">
            <i data-lucide="link-2" class="w-3.5 h-3.5"></i>
            <span id="shareLinkLabel">공유</span>
          </button>
        </div>

        <!-- Dominant Headline -->
        <h1 id="articleTitle" class="article-headline text-2xl sm:text-3xl md:text-[2.2rem] tracking-tight" style="color: var(--text-primary);">
          가닿을 수 없는 성(城), 관료제의 눈보라 속에서 영원히 조난당한 인간의 실존
        </h1>

        <!-- Poetic Subtitle -->
        <p id="articleSubtitle" class="text-base sm:text-lg font-normal leading-relaxed italic" style="color: var(--accent);">
          프란츠 카프카 《성》 — 누구도 최종 결정을 내리지 않는 침묵의 시스템 앞에서
        </p>
      </header>


      <!-- MAIN LONG-FORM BODY -->
      <div class="article-body font-serif" id="articleBody">
        <!-- Injected long-form paragraphs -->
      </div>


      <!-- MINIMAL PULL-QUOTE -->
      <figure class="my-4 py-8 border-y" style="border-color: var(--border-subtle);">
        <blockquote id="articleQuote" class="text-lg sm:text-xl font-normal leading-relaxed italic font-serif" style="color: var(--text-primary);">
          <!-- Quote text -->
        </blockquote>
        <figcaption id="articleQuoteSource" class="text-xs font-sans mt-3 text-right italic font-medium" style="color: var(--accent);">
          <!-- Source -->
        </figcaption>
      </figure>


      <!-- ZEITGEIST CONNECTION: TODAY'S RESEARCH-GROUNDED INSIGHT -->
      <section id="zeitgeistSection" class="mt-2 py-8 border-y" style="border-color: var(--border-subtle);">
        <div class="flex items-center gap-2 mb-3">
          <i data-lucide="newspaper" class="w-3.5 h-3.5" style="color: var(--accent);"></i>
          <span class="text-[11px] font-sans tracking-widest uppercase font-semibold" style="color: var(--accent);">
            시대와의 접속
          </span>
        </div>
        <p id="articleZeitgeist" class="text-sm sm:text-base leading-relaxed font-serif" style="color: var(--text-primary);">
          <!-- Zeitgeist connection text -->
        </p>
      </section>


      <!-- REFLECTIVE INQUIRY & PRIVATE NOTE -->
      <section class="mt-8 pt-10 border-t space-y-6" style="border-color: var(--border-subtle);">
        <div class="space-y-2">
          <span class="text-[11px] font-sans tracking-widest uppercase font-semibold" style="color: var(--accent);">
            사유의 질문
          </span>
          <p id="articlePromptText" class="text-base sm:text-lg leading-relaxed italic font-serif" style="color: var(--text-secondary);">
            <!-- Prompt -->
          </p>
        </div>

        <!-- Subtle Private Ledger -->
        <div class="pt-4 space-y-2">
          <div class="flex items-center justify-between text-xs font-sans">
            <span style="color: var(--text-muted);">나만의 사색 노트</span>
            <span id="saveStatus" class="text-emerald-600 dark:text-emerald-400 opacity-0 transition-opacity">저장됨</span>
          </div>

          <textarea id="reflectionInput" rows="3" placeholder="떠오른 단상을 자유롭게 남겨보세요 (자동 저장)..." class="w-full p-3 rounded-lg border text-xs font-sans leading-relaxed focus:outline-none transition-all resize-none" style="background-color: var(--bg-surface); border-color: var(--border-subtle); color: var(--text-primary);"></textarea>
        </div>
      </section>


      <!-- QUIET CROSS-CATEGORY LINKS -->
      <section id="todayMoreSection" class="mt-6 pt-8 border-t" style="border-color: var(--border-subtle);">
        <div class="flex items-center justify-between mb-2">
          <span class="text-[11px] font-sans tracking-widest uppercase" style="color: var(--text-muted);">다른 시선</span>
          <button onclick="openToday()" class="text-[11px] font-sans hover:opacity-55" style="color: var(--accent);">9편 모두</button>
        </div>
        <div id="todayMoreList"></div>
      </section>

      <!-- BOTTOM ESSAY NAVIGATION -->
      <nav class="mt-12 pt-8 border-t grid grid-cols-3 items-center text-xs font-serif gap-2" style="border-color: var(--border-subtle);">
        <button id="prevBtn" onclick="navigateArticle(-1)" class="text-left hover:opacity-60 transition" style="color: var(--text-muted);">
          ← 이전 글
        </button>
        <button onclick="openToday()" class="text-center hover:opacity-60 transition" style="color: var(--text-muted);">목차</button>
        <button id="nextBtn" onclick="navigateArticle(1)" class="text-right font-medium hover:opacity-60 transition" style="color: var(--accent);">
          <span id="nextBtnLabel">다음 →</span>
        </button>
      </nav>

    </article>

  </main>


  <!-- FOOTER -->
  <footer class="mt-auto py-12 text-center text-xs font-serif" style="color: var(--text-muted); border-top: 1px solid var(--border-subtle);">
    <div class="max-w-2xl mx-auto px-6 space-y-1">
      <div>ARCHE • 문학의 정원</div>
      <div class="text-[11px] opacity-60">Every word echoes through time.</div>
    </div>
  </footer>


  <!-- TODAY'S EDITION OVERVIEW -->
  <div id="todayModal" class="fixed inset-0 z-50 hidden" role="dialog" aria-modal="true" aria-labelledby="todayModalTitle">
    <div class="absolute inset-0 bg-black/30" onclick="closeToday()"></div>
    <div id="todayPanel" class="absolute inset-x-0 bottom-0 sm:inset-y-8 sm:left-1/2 sm:right-auto sm:-translate-x-1/2 w-full max-w-2xl rounded-t-2xl sm:rounded-2xl shadow-xl flex flex-col overflow-hidden" style="background-color: var(--bg-card); max-height: 92vh; border: 1px solid var(--border-subtle);">
      <div class="px-6 py-5 border-b flex items-start justify-between gap-5" style="border-color: var(--border-subtle);">
        <div>
          <h2 id="todayModalTitle" class="font-title text-lg font-semibold tracking-wide" style="color: var(--text-primary);">오늘의 ARCHE</h2>
          <p id="todayModalMeta" class="text-[11px] font-sans mt-1.5" style="color: var(--text-muted);"></p>
        </div>
        <button onclick="closeToday()" class="p-1 hover:opacity-55" style="color: var(--text-muted);" aria-label="오늘의 목차 닫기"><i data-lucide="x" class="w-4 h-4"></i></button>
      </div>
      <div class="overflow-y-auto px-6 pb-6">
        <p class="py-4 text-xs font-serif leading-relaxed border-b" style="color: var(--text-secondary); border-color: var(--border-subtle);">아홉 개의 텍스트로 오늘의 시대를 읽습니다.</p>
        <div id="todayEditionList"></div>
      </div>
    </div>
  </div>

  <!-- ALL-IN-ONE ZEN MENU & 25 ESSAYS MODAL -->
  <div id="zenMenuModal" class="fixed inset-0 z-50 hidden">
    <div id="zenBackdrop" class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeMenu()"></div>
    <div class="absolute right-0 top-0 bottom-0 w-full max-w-md shadow-2xl flex flex-col transition-transform transform translate-x-full duration-300" id="zenDrawer" style="background-color: var(--bg-card); border-left: 1px solid var(--border-subtle);">
      
      <!-- Drawer Header -->
      <div class="p-6 border-b flex items-center justify-between" style="border-color: var(--border-subtle);">
        <div>
          <h2 class="font-title text-base font-semibold tracking-wider" style="color: var(--text-primary);">ARCHE 서재</h2>
          <span class="text-xs font-serif block" style="color: var(--text-muted);" id="zenTotalCount">26편의 에디토리얼 칼럼</span>
          <span class="text-[10px] font-sans block mt-0.5" style="color: var(--accent);" id="zenLastUpdated"></span>
        </div>
        <button onclick="closeMenu()" class="p-1 hover:opacity-60" style="color: var(--text-secondary);">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Reading preferences stay available but out of the primary flow -->
      <details class="px-6 py-3 border-b text-xs font-sans" style="border-color: var(--border-subtle); color: var(--text-muted);">
        <summary class="cursor-pointer select-none hover:opacity-60">읽기 설정</summary>
        <div class="pt-3 flex items-center justify-between">
          <button id="ambienceBtn" onclick="toggleAmbience()" class="flex items-center gap-1.5 hover:opacity-60">
            <i data-lucide="volume-x" id="ambienceIcon" class="w-3.5 h-3.5"></i><span id="ambienceLabel">빗소리 켜기</span>
          </button>
          <div class="flex items-center gap-2"><button onclick="changeFontSize(-1)">A−</button><button onclick="changeFontSize(1)">A＋</button></div>
          <div class="flex items-center gap-2">
            <button onclick="setTheme('theme-paper')" title="종이책" class="w-3.5 h-3.5 rounded-full bg-[#F7F5F0] border border-[#DCD4C4]"></button>
            <button onclick="setTheme('theme-dark')" title="심야 서재" class="w-3.5 h-3.5 rounded-full bg-[#131416] border border-[#2D313A]"></button>
            <button onclick="setTheme('theme-light')" title="순백" class="w-3.5 h-3.5 rounded-full bg-[#FFFFFF] border border-[#E5E7EB]"></button>
          </div>
        </div>
      </details>

      <!-- Keyword Search -->
      <div class="px-6 pt-4 pb-2">
        <div class="relative">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none" style="color: var(--text-muted);"></i>
          <input id="zenSearchInput" type="text" oninput="renderZenList(this.value)" placeholder="작가, 작품, 키워드로 검색..." class="w-full pl-9 pr-3 py-2 rounded-lg border text-xs font-sans focus:outline-none transition-all" style="background-color: var(--bg-surface); border-color: var(--border-subtle); color: var(--text-primary);">
        </div>
      </div>

      <!-- Combinable category filters -->
      <div id="zenCategoryFilters" class="px-6 pb-3 flex gap-2 overflow-x-auto no-scrollbar text-[10px] font-sans"></div>

      <!-- Essays List by Category -->
      <div class="flex-1 overflow-y-auto p-6 pt-2 space-y-8" id="zenEssayList">
        <!-- Rendered by JS -->
      </div>

    </div>
  </div>


  <!-- SCRIPT -->
  <script>
    let columnsData = [];
    let currentCategoryIndex = 0;
    let currentArticleIndex = 0;
    let currentFontSizeRem = 1.125;
    let audioContext = null;
    let isAmbiencePlaying = false;
    let zenCategoryFilter = 'all';
    let latestEditionDate = '';
    let lastRenderedArticleId = '';

    const CATEGORIES = [
      { id: '문학의 심연', label: '문학의 심연' },
      { id: '시네마 & 대본의 시학', label: '시네마 & 대본' },
      { id: '철학적 전율', label: '철학적 전율' },
      { id: '칼럼 & 문화비평', label: '칼럼 & 비평' },
      { id: '신화 & 영원의 기억', label: '신화 & 고전' },
      { id: '시대의 잠언', label: '시대의 잠언' },
      { id: '시', label: '시' },
      { id: '작가의 서신 & 비망록', label: '작가의 서신' },
      { id: '매거진 & 씬', label: '매거진 & 씬' },
    ];

    function getLatestDate() {
      const dates = columnsData.map(a => a.date_added).filter(Boolean).sort();
      return dates.length ? dates[dates.length - 1] : '';
    }

    function getEditionArticles(dateStr) {
      const categoryIndexMap = {};
      CATEGORIES.forEach((cat, idx) => { categoryIndexMap[cat.id] = idx; });
      return columnsData.filter(a => a.date_added === dateStr).sort((a, b) => {
        const catDiff = (categoryIndexMap[a.category] ?? 99) - (categoryIndexMap[b.category] ?? 99);
        return catDiff || ((a.order || 0) - (b.order || 0));
      });
    }

    function getReadIds() {
      try { return JSON.parse(localStorage.getItem('arche_read_v1') || '[]'); }
      catch (err) { return []; }
    }

    function isArticleRead(id) { return getReadIds().includes(id); }

    function markArticleRead(id) {
      if (!id) return;
      const ids = getReadIds();
      if (!ids.includes(id)) {
        ids.push(id);
        localStorage.setItem('arche_read_v1', JSON.stringify(ids.slice(-300)));
        updateTodayContext();
      }
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[ch]));
    }

    function signalExcerpt(value, maxLen = 118) {
      const text = String(value || '').replace(/s+/g, ' ').trim();
      return text.length > maxLen ? text.slice(0, maxLen).trim() + '…' : text;
    }

    function findArticleLocation(id) {
      for (let cIdx = 0; cIdx < CATEGORIES.length; cIdx++) {
        const catArticles = columnsData.filter(c => c.category === CATEGORIES[cIdx].id);
        const aIdx = catArticles.findIndex(a => a.id === id);
        if (aIdx !== -1) return { cIdx, aIdx };
      }
      return null;
    }

    function openArticleById(id, closeOverlays = true) {
      const loc = findArticleLocation(id);
      if (!loc) return;
      if (closeOverlays) { closeToday(); closeMenu(); }
      goToArticle(loc.cIdx, loc.aIdx, true);
    }

    async function initApp() {
      try {
        const res = await fetch(`data/columns_db.json?v=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          columnsData = await res.json();
        }
      } catch (err) {
        console.warn("데이터 로드 실패", err);
      }

      latestEditionDate = getLatestDate();
      const matchedHash = history.state?.archeAutoHash ? false : resolveArticleFromHash();
      if (!matchedHash) resolveLatestArticle();
      renderCategoryNav();
      loadStoredTheme();
      renderCurrentArticle(matchedHash ? 'none' : 'replace');
      updateLibraryMeta();
      setupEventListeners();
      updateReadingProgress();
      lucide.createIcons();
      const editionSeenKey = 'arche_seen_edition_' + latestEditionDate;
      if (latestEditionDate && !localStorage.getItem(editionSeenKey)) {
        localStorage.setItem(editionSeenKey, '1');
        setTimeout(openToday, 550);
      }
    }

    function formatDate(dateStr) {
      if (!dateStr) return '';
      const [y, m, d] = dateStr.split('-');
      return `${y}.${m}.${d}`;
    }

    function updateLibraryMeta() {
      const totalEl = document.getElementById('zenTotalCount');
      const lastUpdatedEl = document.getElementById('zenLastUpdated');
      if (totalEl) totalEl.innerText = `${columnsData.length}편의 에디토리얼 칼럼`;
      const todayCountEl = document.getElementById('headerTodayCount');
      const editionCount = getEditionArticles(latestEditionDate || getLatestDate()).length;
      if (todayCountEl) todayCountEl.innerText = editionCount ? String(editionCount) : '';
      if (lastUpdatedEl) {
        const dates = columnsData.map(a => a.date_added).filter(Boolean).sort();
        const latest = dates[dates.length - 1];
        lastUpdatedEl.innerText = latest ? `최근 업데이트 ${formatDate(latest)}` : '';
      }
    }

    function renderCategoryNav() {
      const nav = document.getElementById('minimalCategoryNav');
      const mobileNav = document.getElementById('mobileCategoryNav');

      const html = CATEGORIES.map((cat, idx) => {
        const isActive = idx === currentCategoryIndex;
        return `
          <button onclick="selectCategory(${idx}, true)" data-category-index="${idx}"
            class="category-nav-button transition-opacity hover:opacity-100 ${isActive ? 'is-active font-bold opacity-100' : 'opacity-60'}"
            style="color: ${isActive ? 'var(--accent)' : 'var(--text-primary)'};">
            ${cat.label}${columnsData.some(a => a.category === cat.id && a.date_added === latestEditionDate) ? '<span class="new-dot" title="오늘 새 글"></span>' : ''}
          </button>
        `;
      }).join('');

      nav.innerHTML = html;
      mobileNav.innerHTML = html;
      requestAnimationFrame(() => {
        const activeMobile = mobileNav.querySelector('[data-category-index="' + currentCategoryIndex + '"]');
        if (activeMobile) activeMobile.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
      });
    }

    function selectCategory(idx, pushHistory = true) {
      currentCategoryIndex = idx;
      currentArticleIndex = findLatestIndexInCategory(idx);
      renderCategoryNav();
      renderCurrentArticle(pushHistory ? 'push' : 'replace');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function findLatestIndexInCategory(catIdx) {
      const cat = CATEGORIES[catIdx];
      if (!cat) return 0;
      const catArticles = columnsData.filter(c => c.category === cat.id);
      if (!catArticles.length) return 0;
      let latestIdx = 0;
      let latestDate = catArticles[0].date_added || '0000-00-00';
      catArticles.forEach((a, i) => {
        const d = a.date_added || '0000-00-00';
        if (d > latestDate) {
          latestDate = d;
          latestIdx = i;
        }
      });
      return latestIdx;
    }

    function getActiveCategoryArticles() {
      const cat = CATEGORIES[currentCategoryIndex];
      return columnsData.filter(item => item.category === cat.id);
    }

    function renderCurrentArticle(urlMode = 'replace') {
      const articles = getActiveCategoryArticles();
      const article = articles[currentArticleIndex];
      if (!article) return;

      const cat = CATEGORIES[currentCategoryIndex];

      // Breadcrumb
      document.getElementById('articleCategoryBreadcrumb').childNodes[0].nodeValue = `${cat.label} — 제 ${article.order}편 (총 ${articles.length}편)`;
      const dateBadge = document.getElementById('articleDateBadge');
      if (article.date_added) {
        dateBadge.innerText = `${formatDate(article.date_added)} 추가`;
        dateBadge.classList.remove('hidden');
      } else {
        dateBadge.classList.add('hidden');
      }

      // Article animation
      const wrapper = document.getElementById('articleContentWrapper');
      wrapper.classList.remove('animate-fadeIn');
      void wrapper.offsetWidth;
      wrapper.classList.add('animate-fadeIn');

      // Headline & Subtitle
      document.getElementById('articleTitle').innerText = article.title;
      document.getElementById('articleSubtitle').innerText = article.subtitle;
      document.getElementById('articleReadTime').innerText = article.read_time || '';
      document.title = article.title + ' | ARCHE';

      // Body paragraphs
      const paras = article.content.split('\n\n');
      let bodyHtml = '';
      if (article.lead) {
        bodyHtml += `<p class="article-lead">${article.lead}</p>`;
      }
      paras.forEach((p, idx) => {
        if (idx === 0) {
          bodyHtml += `<p class="article-dropcap">${p}</p>`;
        } else {
          bodyHtml += `<p>${p}</p>`;
        }
      });
      document.getElementById('articleBody').innerHTML = bodyHtml;

      // Quote
      document.getElementById('articleQuote').innerText = article.key_quote;
      document.getElementById('articleQuoteSource').innerText = `— ${article.key_quote_source}`;

      // Prompt
      document.getElementById('articlePromptText').innerText = article.reflection_prompt;

      // Zeitgeist connection (today's research-grounded insight)
      const zgSection = document.getElementById('zeitgeistSection');
      if (article.zeitgeist_connection) {
        document.getElementById('articleZeitgeist').innerText = article.zeitgeist_connection;
        zgSection.classList.remove('hidden');
      } else {
        zgSection.classList.add('hidden');
      }

      // Sync shareable URL (deep link to this article)
      updateUrlHash(article.id, urlMode);

      // Reading flow: today's edition is a deliberate 9-part sequence
      const prevBtn = document.getElementById('prevBtn');
      const nextBtnLabel = document.getElementById('nextBtnLabel');
      const edition = getEditionArticles(article.date_added);
      const editionIndex = edition.findIndex(a => a.id === article.id);
      const isLatestEdition = article.date_added === latestEditionDate && editionIndex !== -1;

      if (isLatestEdition) {
        prevBtn.style.visibility = 'visible';
        if (editionIndex === 0) {
          prevBtn.innerText = '← 목차';
        } else {
          const prevCat = CATEGORIES.find(c => c.id === edition[editionIndex - 1].category);
          prevBtn.innerText = '← ' + ((prevCat && prevCat.label) || '이전 글');
        }
        if (editionIndex === edition.length - 1) {
          nextBtnLabel.innerText = '목차로 ↺';
        } else {
          const nextCat = CATEGORIES.find(c => c.id === edition[editionIndex + 1].category);
          nextBtnLabel.innerText = ((nextCat && nextCat.label) || '다음') + ' →';
        }
      } else {
        prevBtn.innerText = '← 이전';
        prevBtn.style.visibility = (currentCategoryIndex === 0 && currentArticleIndex === 0) ? 'hidden' : 'visible';
        if (currentArticleIndex === articles.length - 1) {
          nextBtnLabel.innerText = currentCategoryIndex < CATEGORIES.length - 1
            ? CATEGORIES[currentCategoryIndex + 1].label + ' →'
            : '최신 글로 돌아가기 ↺';
        } else {
          nextBtnLabel.innerText = '다음 →';
        }
      }

      lastRenderedArticleId = article.id;
      localStorage.setItem('arche_last_article_v1', article.id);
      updateTodayContext();
      renderTodayMore(article);
      requestAnimationFrame(updateReadingProgress);

      // Load Note
      loadNote(article.id);
      lucide.createIcons();
    }

    function updateUrlHash(articleId, mode = 'replace') {
      if (!articleId || mode === 'none') return;
      const newHash = '#' + encodeURIComponent(articleId);
      const state = { archeAutoHash: true, articleId };
      if (mode === 'push' && location.hash !== newHash) {
        history.pushState(state, '', newHash);
      } else {
        history.replaceState(state, '', newHash);
      }
    }

    function resolveArticleFromHash() {
      const raw = decodeURIComponent((location.hash || '').replace(/^#/, ''));
      if (!raw) return false;
      for (let cIdx = 0; cIdx < CATEGORIES.length; cIdx++) {
        const catArticles = columnsData.filter(c => c.category === CATEGORIES[cIdx].id);
        const aIdx = catArticles.findIndex(a => a.id === raw);
        if (aIdx !== -1) {
          currentCategoryIndex = cIdx;
          currentArticleIndex = aIdx;
          return true;
        }
      }
      return false;
    }

    function resolveLatestArticle() {
      if (!columnsData.length) return false;
      let latest = columnsData[0];
      columnsData.forEach(a => {
        const dLatest = latest.date_added || '0000-00-00';
        const dA = a.date_added || '0000-00-00';
        if (dA > dLatest) latest = a;
      });
      const cIdx = CATEGORIES.findIndex(c => c.id === latest.category);
      if (cIdx === -1) return false;
      const catArticles = columnsData.filter(c => c.category === latest.category);
      const aIdx = catArticles.indexOf(latest);
      currentCategoryIndex = cIdx;
      currentArticleIndex = aIdx;
      return true;
    }

    function goToLatestArticle() {
      resolveLatestArticle();
      renderCategoryNav();
      renderCurrentArticle('push');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function copyArticleLink() {
      const articles = getActiveCategoryArticles();
      const article = articles[currentArticleIndex];
      if (!article) return;
      const shareUrl = new URL(location.href);
      shareUrl.search = '';
      shareUrl.hash = '#' + encodeURIComponent(article.id);
      const label = document.getElementById('shareLinkLabel');
      const finish = (text) => {
        if (!label) return;
        label.innerText = text;
        setTimeout(() => { label.innerText = '공유'; }, 1500);
      };
      if (navigator.share) {
        try {
          await navigator.share({ title: article.title + ' | ARCHE', text: article.subtitle, url: shareUrl.toString() });
          finish('공유 완료');
          return;
        } catch (err) {
          if (err && err.name === 'AbortError') return;
        }
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareUrl.toString()).then(() => finish('링크 복사 완료')).catch(() => finish('복사 실패'));
      } else {
        finish('복사 실패');
      }
    }

    function goToArticle(catIdx, artIdx, pushHistory = true) {
      currentCategoryIndex = catIdx;
      currentArticleIndex = artIdx;
      renderCategoryNav();
      renderCurrentArticle(pushHistory ? 'push' : 'replace');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function navigateArticle(dir) {
      const articles = getActiveCategoryArticles();
      const article = articles[currentArticleIndex];
      if (!article) return;

      const edition = getEditionArticles(article.date_added);
      const editionIndex = edition.findIndex(a => a.id === article.id);
      if (article.date_added === latestEditionDate && editionIndex !== -1) {
        const targetIndex = editionIndex + dir;
        if (targetIndex < 0 || targetIndex >= edition.length) {
          openToday();
          return;
        }
        openArticleById(edition[targetIndex].id, false);
        return;
      }

      let nextArtIdx = currentArticleIndex + dir;
      if (nextArtIdx >= 0 && nextArtIdx < articles.length) {
        goToArticle(currentCategoryIndex, nextArtIdx, true);
      } else if (nextArtIdx >= articles.length) {
        if (currentCategoryIndex < CATEGORIES.length - 1) selectCategory(currentCategoryIndex + 1, true);
        else goToLatestArticle();
      } else if (nextArtIdx < 0 && currentCategoryIndex > 0) {
        currentCategoryIndex--;
        const prevArticles = getActiveCategoryArticles();
        goToArticle(currentCategoryIndex, prevArticles.length - 1, true);
      }
    }

    function changeFontSize(delta) {
      currentFontSizeRem = Math.min(1.4, Math.max(0.95, currentFontSizeRem + (delta * 0.05)));
      document.documentElement.style.setProperty('--article-font-size', `${currentFontSizeRem}rem`);
    }

    function loadNote(id) {
      const note = localStorage.getItem(`arche_note_v3_${id}`) || '';
      document.getElementById('reflectionInput').value = note;
    }

    function saveCurrentNote() {
      const articles = getActiveCategoryArticles();
      const article = articles[currentArticleIndex];
      if (!article) return;

      const val = document.getElementById('reflectionInput').value;
      localStorage.setItem(`arche_note_v3_${article.id}`, val);

      const status = document.getElementById('saveStatus');
      status.classList.remove('opacity-0');
      status.classList.add('opacity-100');
      setTimeout(() => {
        status.classList.remove('opacity-100');
        status.classList.add('opacity-0');
      }, 1500);
    }

    function setTheme(theme) {
      document.documentElement.className = theme;
      localStorage.setItem('arche_theme_v3', theme);
    }

    function loadStoredTheme() {
      const stored = localStorage.getItem('arche_theme_v3') || 'theme-paper';
      setTheme(stored);
    }

    // Ambience
    function toggleAmbience() {
      if (!isAmbiencePlaying) {
        startAmbience();
      } else {
        stopAmbience();
      }
    }

    function startAmbience() {
      try {
        if (!audioContext) {
          audioContext = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        const bufferSize = audioContext.sampleRate * 2;
        const noiseBuffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
        const output = noiseBuffer.getChannelData(0);
        let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          b0 = 0.99886 * b0 + white * 0.0555179;
          b1 = 0.99332 * b1 + white * 0.0750759;
          b2 = 0.96900 * b2 + white * 0.1538520;
          b3 = 0.86650 * b3 + white * 0.3104856;
          b4 = 0.55000 * b4 + white * 0.5329522;
          b5 = -0.7616 * b5 - white * 0.0168980;
          output[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * 0.04;
          b6 = white * 0.115926;
        }

        const whiteNoise = audioContext.createBufferSource();
        whiteNoise.buffer = noiseBuffer;
        whiteNoise.loop = true;

        const filter = audioContext.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 700;

        const gainNode = audioContext.createGain();
        gainNode.gain.setValueAtTime(0.12, audioContext.currentTime);

        whiteNoise.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioContext.destination);

        whiteNoise.start();
        window._ambienceSource = whiteNoise;
        isAmbiencePlaying = true;

        document.getElementById('ambienceIcon').setAttribute('data-lucide', 'volume-2');
        document.getElementById('ambienceLabel').innerText = '빗소리 끄기';
        lucide.createIcons();
      } catch (err) {
        console.error("Audio error", err);
      }
    }

    function stopAmbience() {
      if (window._ambienceSource) {
        window._ambienceSource.stop();
        window._ambienceSource.disconnect();
      }
      isAmbiencePlaying = false;
      document.getElementById('ambienceIcon').setAttribute('data-lucide', 'volume-x');
      document.getElementById('ambienceLabel').innerText = '빗소리 켜기';
      lucide.createIcons();
    }

    function updateTodayContext() {
      const articles = getActiveCategoryArticles();
      const article = articles[currentArticleIndex];
      if (!article) return;
      const edition = getEditionArticles(article.date_added);
      const readCount = edition.filter(a => isArticleRead(a.id)).length;
      const label = document.getElementById('todayContextLabel');
      const count = document.getElementById('todayContextCount');
      const progress = document.getElementById('todayReadProgress');
      if (label) label.innerText = article.date_added === latestEditionDate ? '오늘의 ARCHE' : formatDate(article.date_added) + ' 에디션';
      if (count) count.innerText = edition.length + '편';
      if (progress) progress.innerText = readCount + ' / ' + edition.length + ' 읽음';
    }

    function renderTodayMore(article) {
      const container = document.getElementById('todayMoreList');
      const section = document.getElementById('todayMoreSection');
      if (!container || !section || !article) return;
      const edition = getEditionArticles(article.date_added);
      const currentIndex = edition.findIndex(a => a.id === article.id);
      const others = [];
      for (let step = 1; step < edition.length && others.length < 3; step++) {
        const candidate = edition[(currentIndex + step) % edition.length];
        if (candidate && candidate.id !== article.id) others.push(candidate);
      }
      section.classList.toggle('hidden', others.length === 0);
      container.innerHTML = others.map(a => {
        const cat = CATEGORIES.find(c => c.id === a.category);
        return '<button class="today-link-row ' + (isArticleRead(a.id) ? 'is-read' : '') + '" data-article-id="' + escapeHtml(a.id) + '" onclick="openArticleById(this.dataset.articleId)">' +
          '<span><span class="block text-[10px] font-sans mb-1" style="color: var(--text-muted);">' + escapeHtml((cat && cat.label) || a.category) + '</span><span class="block text-sm font-serif leading-relaxed" style="color: var(--text-primary);">' + escapeHtml(a.title) + '</span></span>' +
          '<span class="text-xs" style="color: var(--text-muted);">→</span>' +
          '</button>';
      }).join('');
    }

    function renderTodayEdition() {
      const edition = getEditionArticles(latestEditionDate || getLatestDate());
      const container = document.getElementById('todayEditionList');
      const meta = document.getElementById('todayModalMeta');
      const readCount = edition.filter(a => isArticleRead(a.id)).length;
      if (meta) meta.innerText = formatDate(latestEditionDate) + ' · ' + readCount + '/' + edition.length + ' 읽음';
      if (!container) return;
      container.innerHTML = edition.map((a, idx) => {
        const cat = CATEGORIES.find(c => c.id === a.category);
        const read = isArticleRead(a.id);
        return '<button class="today-card ' + (read ? 'is-read' : '') + '" data-article-id="' + escapeHtml(a.id) + '" onclick="openArticleById(this.dataset.articleId)">' +
          '<div class="flex items-baseline gap-3"><span class="text-[10px] font-sans shrink-0" style="color: var(--text-muted);">' + String(idx + 1).padStart(2, '0') + '</span><span class="text-[10px] font-sans uppercase tracking-wider" style="color: var(--accent);">' + escapeHtml((cat && cat.label) || a.category) + '</span><span class="ml-auto text-[10px] font-sans" style="color: var(--text-muted);">' + (read ? '읽음' : escapeHtml(a.read_time || '')) + '</span></div>' +
          '<div class="pl-7 mt-1 text-sm sm:text-base font-serif font-medium leading-relaxed" style="color: var(--text-primary);">' + escapeHtml(a.title) + '</div>' +
          '<div class="pl-7 mt-1 text-[11px] font-sans" style="color: var(--text-muted);">' + escapeHtml(a.author_topic) + '</div>' +
          '<div class="today-signal pl-7 mt-2 text-xs font-serif leading-relaxed" style="color: var(--text-secondary);">' + escapeHtml(signalExcerpt(a.zeitgeist_connection, 112)) + '</div>' +
          '</button>';
      }).join('');
    }

    function openToday() {
      closeMenu();
      renderTodayEdition();
      const modal = document.getElementById('todayModal');
      if (modal) modal.classList.remove('hidden');
      document.body.classList.add('modal-open');
      lucide.createIcons();
    }

    function closeToday() {
      const modal = document.getElementById('todayModal');
      if (modal) modal.classList.add('hidden');
      if (document.getElementById('zenMenuModal').classList.contains('hidden')) document.body.classList.remove('modal-open');
    }

    function openSearch() {
      openMenu();
      setTimeout(() => { const input = document.getElementById('zenSearchInput'); if (input) input.focus(); }, 340);
    }

    function updateReadingProgress() {
      const wrapper = document.getElementById('articleContentWrapper');
      const bar = document.getElementById('readingProgressBar');
      if (!wrapper || !bar) return;
      const top = wrapper.offsetTop;
      const height = Math.max(wrapper.offsetHeight, 1);
      const seen = window.scrollY + window.innerHeight - top;
      const progress = Math.max(0, Math.min(1, seen / height));
      bar.style.width = (progress * 100).toFixed(1) + '%';
      if (progress >= 0.85 && lastRenderedArticleId) markArticleRead(lastRenderedArticleId);
    }

    function handleHistoryNavigation() {
      if (!resolveArticleFromHash()) resolveLatestArticle();
      renderCategoryNav();
      renderCurrentArticle('none');
      window.scrollTo({ top: 0, behavior: 'auto' });
    }

    // Zen Drawer
    function renderZenCategoryFilters() {
      const container = document.getElementById('zenCategoryFilters');
      if (!container) return;
      const options = [{ id: 'all', label: '전체' }].concat(CATEGORIES);
      container.innerHTML = options.map(option => {
        const active = zenCategoryFilter === option.id;
        return '<button onclick="setZenCategoryFilter(this.dataset.category)" data-category="' + escapeHtml(option.id) + '" class="px-2.5 py-1.5 rounded-full border shrink-0 ' + (active ? 'font-semibold' : 'opacity-60') + '" style="border-color: ' + (active ? 'var(--accent)' : 'var(--border-subtle)') + '; color: ' + (active ? 'var(--accent)' : 'var(--text-secondary)') + '; background: ' + (active ? 'var(--accent-soft)' : 'transparent') + ';">' + escapeHtml(option.label) + '</button>';
      }).join('');
    }

    function setZenCategoryFilter(category) {
      zenCategoryFilter = category || 'all';
      renderZenCategoryFilters();
      const input = document.getElementById('zenSearchInput');
      renderZenList(input ? input.value : '');
    }

    function renderZenList(query) {
      const q = (query || '').trim().toLowerCase();
      const container = document.getElementById('zenEssayList');

      const categoryIndexMap = {};
      CATEGORIES.forEach((cat, idx) => { categoryIndexMap[cat.id] = idx; });

      let items = columnsData.slice();
      if (zenCategoryFilter !== 'all') items = items.filter(a => a.category === zenCategoryFilter);
      if (q) {
        items = items.filter(a =>
          (a.title || '').toLowerCase().includes(q) ||
          (a.subtitle || '').toLowerCase().includes(q) ||
          (a.author_topic || '').toLowerCase().includes(q) ||
          (a.category || '').toLowerCase().includes(q) ||
          (a.content || '').toLowerCase().includes(q) ||
          (a.zeitgeist_connection || '').toLowerCase().includes(q)
        );
      }

      // 최신 업데이트순 (date_added 내림차순) 정렬
      items.sort((a, b) => {
        const dA = a.date_added || '0000-00-00';
        const dB = b.date_added || '0000-00-00';
        if (dA !== dB) return dB.localeCompare(dA);
        return (a.order || 0) - (b.order || 0);
      });

      if (items.length === 0) {
        container.innerHTML = `<div class="text-xs font-sans text-center py-10" style="color: var(--text-muted);">검색 결과가 없습니다.</div>`;
        lucide.createIcons();
        return;
      }

      // 날짜별로 그룹핑하여 헤더 표시
      const groups = [];
      let lastDate = null;
      items.forEach(a => {
        const d = a.date_added || '날짜 미상';
        if (d !== lastDate) {
          groups.push({ date: d, items: [] });
          lastDate = d;
        }
        groups[groups.length - 1].items.push(a);
      });

      container.innerHTML = groups.map(group => {
        const dateLabel = group.date === '날짜 미상' ? group.date : formatDate(group.date);
        return `
          <div>
            <h3 class="font-serif text-xs uppercase font-bold tracking-widest mb-3 opacity-60 flex items-center gap-2" style="color: var(--accent);">
              <span>${dateLabel}</span>
              <span class="opacity-50 font-sans normal-case tracking-normal">· ${group.items.length}편</span>
            </h3>
            <div class="space-y-3">
              ${group.items.map((a) => {
                const cIdx = categoryIndexMap[a.category];
                const catArticles = columnsData.filter(c => c.category === a.category);
                const aIdx = catArticles.indexOf(a);
                const catLabel = (CATEGORIES[cIdx] || {}).label || a.category;
                return `
                <div onclick="goToArticle(${cIdx}, ${aIdx}); closeMenu();" class="cursor-pointer group">
                  <div class="text-[10px] font-sans uppercase tracking-wide opacity-50 mb-0.5" style="color: var(--text-muted);">${catLabel}</div>
                  <div class="text-xs sm:text-sm font-serif font-medium leading-snug group-hover:text-amber-800 transition" style="color: var(--text-primary);">
                    ${a.title}
                  </div>
                  <div class="text-[11px] font-sans italic opacity-60 mt-0.5" style="color: var(--text-muted);">
                    ${a.author_topic}
                  </div>
                </div>
              `;
              }).join('')}
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function openMenu() {
      closeToday();
      const searchInput = document.getElementById('zenSearchInput');
      if (searchInput) searchInput.value = '';
      zenCategoryFilter = 'all';
      renderZenCategoryFilters();
      renderZenList('');

      document.getElementById('zenMenuModal').classList.remove('hidden');
      document.body.classList.add('modal-open');
      setTimeout(() => {
        document.getElementById('zenDrawer').classList.remove('translate-x-full');
      }, 20);
      lucide.createIcons();
    }

    function closeMenu() {
      document.getElementById('zenDrawer').classList.add('translate-x-full');
      setTimeout(() => {
        document.getElementById('zenMenuModal').classList.add('hidden');
        if (document.getElementById('todayModal').classList.contains('hidden')) document.body.classList.remove('modal-open');
      }, 300);
    }

    function setupEventListeners() {
      let timer = null;
      document.getElementById('reflectionInput').addEventListener('input', () => {
        clearTimeout(timer);
        timer = setTimeout(saveCurrentNote, 500);
      });
      window.addEventListener('scroll', updateReadingProgress, { passive: true });
      window.addEventListener('resize', updateReadingProgress);
      window.addEventListener('popstate', handleHistoryNavigation);
      document.addEventListener('keydown', event => {
        if (event.key !== 'Escape') return;
        if (!document.getElementById('todayModal').classList.contains('hidden')) closeToday();
        else if (!document.getElementById('zenMenuModal').classList.contains('hidden')) closeMenu();
      });
    }

    window.addEventListener('DOMContentLoaded', initApp);
  </script>
</body>
</html>
